name: Qualify AKernel gVisor candidate
run-name: Qualify candidate ${{ inputs.candidate_run_id }}
'on':
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful candidate workflow run in akernel-dev/gvisor
        required: true
        type: string
      sandboxd_ref:
        description: Exact sandboxd implementation commit
        default: 9267dbe5196521c1c62371173012ad7a45dbc7be
        required: true
        type: string
      akernel_ref:
        description: Exact AKernel develop commit
        default: d498636d6932aa15ac98650cf12f8f8739718482
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: gvisor-qualification-${{ inputs.candidate_run_id }}
  cancel-in-progress: false
jobs:
  candidate:
    name: Verify candidate provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      commit: ${{ steps.verify.outputs.commit }}
      release: ${{ steps.assemble.outputs.release }}
    steps:
    - name: Check out hky1999/gvisor
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: hky1999/gvisor
        ref: ${{ github.sha }}
        path: gvisor-tools
        persist-credentials: false
    - name: Identify successful gated build
      id: verify
      env:
        GH_TOKEN: ${{ github.token }}
        CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      run: |
        set -euo pipefail
        [[ "${CANDIDATE_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
        gh api "repos/akernel-dev/gvisor/actions/runs/${CANDIDATE_RUN_ID}" >"${RUNNER_TEMP}/candidate-run.json"
        python3 - <<'CHECK'
        import json,os,re
        from pathlib import Path
        run=json.loads((Path(os.environ['RUNNER_TEMP'])/'candidate-run.json').read_text())
        assert run['path']=='.github/workflows/akernel-candidate.yml'
        assert run['event']=='workflow_dispatch' and run['conclusion']=='success'
        assert run['head_repository']['full_name']=='akernel-dev/gvisor'
        assert re.fullmatch('[0-9a-f]{40}',run['head_sha'])
        with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('commit='+run['head_sha']+'\n')
        CHECK
    - name: Download both architecture candidates
      uses: actions/download-artifact@v5
      with:
        pattern: gvisor-candidate-${{ inputs.candidate_run_id }}-*
        path: ${{ runner.temp }}/candidates
        github-token: ${{ github.token }}
        run-id: ${{ inputs.candidate_run_id }}
        repository: akernel-dev/gvisor
    - name: Validate archive bytes and assemble provenance
      id: assemble
      env:
        GH_TOKEN: ${{ github.token }}
        CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        CANDIDATE_COMMIT: ${{ steps.verify.outputs.commit }}
      run: |
        set -euo pipefail
        cd gvisor-tools
        git fetch https://github.com/akernel-dev/gvisor.git "${CANDIDATE_COMMIT}"
        upstream_tag="$(jq -er '.upstream_tag' "${RUNNER_TEMP}/candidates/gvisor-candidate-${CANDIDATE_RUN_ID}-amd64/candidate-amd64.json")"
        git fetch --no-tags https://github.com/google/gvisor.git "refs/tags/${upstream_tag}:refs/tags/${upstream_tag}"
        python3 tools/akernel-candidate-manifest.py assemble "${RUNNER_TEMP}/candidates" \
          "akernel-dev/gvisor" "${CANDIDATE_COMMIT}" "${CANDIDATE_RUN_ID}" "${RUNNER_TEMP}/manifest.json"
        echo "release=$(jq -r .release_tag "${RUNNER_TEMP}/manifest.json")" >>"${GITHUB_OUTPUT}"
        for arch in amd64 arm64; do
          bash tools/akernel-release-archive.sh verify "$arch" \
            "${RUNNER_TEMP}/candidates/gvisor-candidate-${CANDIDATE_RUN_ID}-${arch}/gvisor-${arch}.tar.bz2"
        done
    - name: Retain verified manifest
      uses: actions/upload-artifact@v4
      with:
        name: candidate-manifest
        path: ${{ runner.temp }}/manifest.json
        retention-days: 7
  binaries:
    name: Runtime E2E binaries
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
    - name: Check out hky1999/sandboxd
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: hky1999/sandboxd
        ref: ${{ inputs.sandboxd_ref }}
        path: sandboxd
        persist-credentials: false
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: sandboxd/go.mod
        cache: true
        cache-dependency-path: sandboxd/go.sum
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libseccomp-dev
    - name: Check sandboxd formatting, vet and unit tests
      run: |
        make check-fmt
        make vet
        make test
    - name: Build runtime E2E binaries
      run: make e2e-runtime-binaries
    - name: Pack runtime E2E binaries
      run: |
        tar -czf output/sandboxd-e2e-binaries.tar.gz \
          -C output \
          sandboxd \
          sbox \
          runc-shim \
          sandbox-logger \
          firecracker-agent \
          oom-hog \
          network-policy-client \
          checkpoint-restore
    - name: Upload runtime E2E binaries
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: qualification-sandboxd-binaries
        path: sandboxd/output/sandboxd-e2e-binaries.tar.gz
        compression-level: 0
        retention-days: 1
    needs: candidate
    defaults:
      run:
        working-directory: sandboxd
  runtime:
    name: Runtime E2E (${{ matrix.name }})
    needs:
    - candidate
    - binaries
    runs-on: ${{ matrix.runner || 'ubuntu-22.04' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
        - name: runsc-systrap
          needs_kvm: false
        - name: runsc-kvm
          needs_kvm: true
        - name: runsc-reflink
          needs_kvm: false
          needs_reflink: true
          runner: ubuntu-24.04
        - name: kata
          needs_kvm: true
        - name: firecracker
          needs_kvm: true
        - name: firecracker-incremental
          needs_kvm: true
          checkpoint_mode: incremental
        - name: firecracker-virtiofs
          needs_kvm: true
        - name: runc
          needs_kvm: false
    steps:
    - name: Check out hky1999/sandboxd
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: hky1999/sandboxd
        ref: ${{ inputs.sandboxd_ref }}
        path: sandboxd
        persist-credentials: false
    - name: Check out hky1999/gvisor
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: hky1999/gvisor
        ref: ${{ github.sha }}
        path: gvisor-tools
        persist-credentials: false
    - name: Download exact candidate archive
      uses: actions/download-artifact@v5
      with:
        pattern: gvisor-candidate-${{ inputs.candidate_run_id }}-*
        merge-multiple: true
        path: ${{ runner.temp }}/candidate-bundles
        github-token: ${{ github.token }}
        run-id: ${{ inputs.candidate_run_id }}
        repository: akernel-dev/gvisor
    - name: Download verified candidate provenance
      uses: actions/download-artifact@v5
      with:
        name: candidate-manifest
        path: ${{ runner.temp }}/candidate-provenance
    - name: Stage candidate through the runtime manifest
      run: |
        set -euo pipefail
        candidate_dir="${RUNNER_TEMP}/candidate-bundles"
        gateway="$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}')"
        python3 "${GITHUB_WORKSPACE}/gvisor-tools/tools/akernel-qualify-manifest.py" \
          "${RUNNER_TEMP}/candidate-provenance/manifest.json" \
          "${candidate_dir}" \
          "${GITHUB_WORKSPACE}/sandboxd/third_party/runtime-versions.env" "${RUNNER_TEMP}/runtime-versions.env" \
          "http://${gateway}:18687"
        nohup python3 -m http.server 18687 --bind "${gateway}" --directory "${candidate_dir}" \
          >"${RUNNER_TEMP}/candidate-http.log" 2>&1 &
        echo "$!" >"${RUNNER_TEMP}/candidate-http.pid"
        echo "RUNTIME_VERSIONS_FILE=${RUNNER_TEMP}/runtime-versions.env" >>"${GITHUB_ENV}"
    - name: Download runtime E2E binaries
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: qualification-sandboxd-binaries
        path: sandboxd/output
    - name: Unpack runtime E2E binaries
      run: |
        tar -xzf output/sandboxd-e2e-binaries.tar.gz -C output
    - name: Install host dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cpu-checker \
          "linux-modules-extra-$(uname -r)"
    - name: Prepare network and filesystem prerequisites
      run: |
        sudo modprobe erofs
        sudo modprobe br_netfilter
        sudo modprobe ip6_tables
        sudo modprobe ip6table_filter
        sudo sysctl -w net.bridge.bridge-nf-call-iptables=1
        sudo sysctl -w net.bridge.bridge-nf-call-ip6tables=1
        test -c /dev/net/tun
    - name: Verify nested KVM
      if: matrix.needs_kvm
      run: |
        sudo modprobe kvm
        sudo chmod 0666 /dev/kvm
        test -c /dev/kvm
        test -r /dev/kvm
        test -w /dev/kvm
        sudo kvm-ok
    - name: Prepare shared XFS fixture for filestore reflinks
      if: matrix.needs_reflink
      run: |
        sudo apt-get install -y xfsprogs
        sudo modprobe loop
        sudo modprobe xfs
        truncate -s 6G "${RUNNER_TEMP}/reflink-home.img"
        sudo mkfs.xfs -f -m reflink=1 "${RUNNER_TEMP}/reflink-home.img"
        mkdir -p "${RUNNER_TEMP}/reflink-home"
        sudo mount -o loop "${RUNNER_TEMP}/reflink-home.img" "${RUNNER_TEMP}/reflink-home"
        sudo chown "$(id -u):$(id -g)" "${RUNNER_TEMP}/reflink-home"
        echo "E2E_HOME_FIXTURE_PARENT=${RUNNER_TEMP}/reflink-home" >>"${GITHUB_ENV}"
    - name: Run runtime E2E
      env:
        E2E_CASE: ${{ matrix.name }}
        E2E_FIRECRACKER_CHECKPOINT_MODE: ${{ matrix.checkpoint_mode }}
      run: make e2e-runtime-case
    - name: Release XFS fixture
      if: always() && matrix.needs_reflink
      run: |
        if mountpoint -q "${RUNNER_TEMP}/reflink-home"; then
          sudo umount "${RUNNER_TEMP}/reflink-home"
        fi
    - name: Stop candidate artifact server
      if: always()
      run: if [[ -f "${RUNNER_TEMP}/candidate-http.pid" ]]; then kill "$(cat "${RUNNER_TEMP}/candidate-http.pid")" || true; fi
    defaults:
      run:
        working-directory: sandboxd
  standalone:
    name: Standalone E2E
    needs: candidate
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
    - name: Check out inclusionAI/AKernel
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: inclusionAI/AKernel
        ref: ${{ inputs.akernel_ref }}
        path: akernel
        persist-credentials: false
    - name: Check out hky1999/gvisor
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: hky1999/gvisor
        ref: ${{ github.sha }}
        path: gvisor-tools
        persist-credentials: false
    - name: Check out the sandboxd implementation
      env:
        SANDBOXD_REF: ${{ inputs.sandboxd_ref }}
      run: |
        set -euo pipefail
        [[ "${SANDBOXD_REF}" =~ ^[0-9a-f]{40}$ ]]
        git submodule update --init src/sandboxd
        git -C src/sandboxd fetch https://github.com/hky1999/sandboxd.git "${SANDBOXD_REF}"
        git -C src/sandboxd checkout --detach "${SANDBOXD_REF}"
    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: akernel/sdk/python/pyproject.toml
    - name: Install SDK dependencies
      run: |
        python -m pip install -e './sdk/python[all]'
    - name: Prepare host kernel modules
      run: |
        sudo modprobe tun
        sudo modprobe loop
        sudo modprobe erofs
        sudo modprobe br_netfilter
        test -c /dev/net/tun
        sudo sysctl -w net.bridge.bridge-nf-call-iptables=1
    - name: Download exact candidate archive
      uses: actions/download-artifact@v5
      with:
        pattern: gvisor-candidate-${{ inputs.candidate_run_id }}-*
        merge-multiple: true
        path: ${{ runner.temp }}/candidate-bundles
        github-token: ${{ github.token }}
        run-id: ${{ inputs.candidate_run_id }}
        repository: akernel-dev/gvisor
    - name: Download verified candidate provenance
      uses: actions/download-artifact@v5
      with:
        name: candidate-manifest
        path: ${{ runner.temp }}/candidate-provenance
    - name: Stage candidate through the runtime manifest
      run: |
        set -euo pipefail
        candidate_dir="${RUNNER_TEMP}/candidate-bundles"
        gateway="$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}')"
        python3 "${GITHUB_WORKSPACE}/gvisor-tools/tools/akernel-qualify-manifest.py" \
          "${RUNNER_TEMP}/candidate-provenance/manifest.json" \
          "${candidate_dir}" \
          "${GITHUB_WORKSPACE}/akernel/src/sandboxd/third_party/runtime-versions.env" "${RUNNER_TEMP}/runtime-versions.env" \
          "http://${gateway}:18687"
        nohup python3 -m http.server 18687 --bind "${gateway}" --directory "${candidate_dir}" \
          >"${RUNNER_TEMP}/candidate-http.log" 2>&1 &
        echo "$!" >"${RUNNER_TEMP}/candidate-http.pid"
        echo "RUNTIME_VERSIONS_FILE=${RUNNER_TEMP}/runtime-versions.env" >>"${GITHUB_ENV}"
    - name: Pin candidate in clean local validation commits
      run: |
        set -euo pipefail
        cp "${RUNTIME_VERSIONS_FILE}" src/sandboxd/third_party/runtime-versions.env
        git -C src/sandboxd -c user.name='Candidate validation' -c user.email='candidate@localhost' \
          commit -am 'test: pin exact gated candidate for local qualification'
        git add src/sandboxd
        git -c user.name='Candidate validation' -c user.email='candidate@localhost' \
          commit -m 'test: validate AKernel with the exact sandboxd candidate'
        # Enable the new mode only in this isolated standalone profile.
        python3 - <<'CONFIG'
        from pathlib import Path
        p=Path('deploy/standalone/config/sandboxd_config.toml')
        s=p.read_text().replace('filestore_dir_size="50G"','filestore_dir_size=""')
        s=s.replace('[plugin.runtime.runsc]', '[plugin.runtime.runsc]\ncheckpoint_mode="reflink"')
        p.write_text(s)
        CONFIG
    - name: Build all-in-one image
      env:
        AKERNEL_ENABLE_KATA: 'false'
        AKERNEL_ENABLE_FIRECRACKER: 'false'
        AKERNEL_ENABLE_RUNC: 'false'
      run: |
        make build \
          IMAGE_REPOSITORY=akernel-ci/all-in-one \
          IMAGE_TAG="${GITHUB_SHA}"
    - name: Verify systemd container identity in the image
      run: |
        docker image inspect "akernel-ci/all-in-one:${GITHUB_SHA}" \
          --format '{{json .Config.Env}}' | \
          python -c 'import json, sys; assert "container=oci" in json.load(sys.stdin)'
    - name: Verify gVisor-only runtime payload
      run: |
        docker run --rm --entrypoint /bin/bash \
          "akernel-ci/all-in-one:${GITHUB_SHA}" -euc '
            test -x /usr/local/bin/runsc
            test -x /usr/local/bin/containerd-shim-runsc-v1
            for helper in checkpointgofer gvisor-sentry-prewarmer gvisor_sentry runsc-metric-server; do
              test -x "/usr/local/bin/gvisor-bin/${helper}"
            done
            test ! -e /usr/local/bin/containerd-shim-kata-v2
            test ! -e /opt/kata/runtime-rs/bin/containerd-shim-kata-v2
            test ! -e /usr/local/bin/firecracker
            test ! -e /usr/local/bin/virtiofsd
            test ! -e /opt/firecracker/vmlinux
            test ! -e /opt/firecracker/initrd.img
            test ! -e /usr/local/bin/runc
            test ! -e /usr/local/bin/runc-shim
          '
    - name: Prepare isolated XFS standalone storage
      run: |
        set -euo pipefail
        sudo apt-get install -y xfsprogs
        sudo modprobe xfs
        truncate -s 12G "${RUNNER_TEMP}/reflink-home.img"
        sudo mkfs.xfs -f -m reflink=1 "${RUNNER_TEMP}/reflink-home.img"
        mkdir -p "${RUNNER_TEMP}/reflink-home"
        sudo mount -o loop "${RUNNER_TEMP}/reflink-home.img" "${RUNNER_TEMP}/reflink-home"
        sudo chown "$(id -u):$(id -g)" "${RUNNER_TEMP}/reflink-home"
        echo "AKERNEL_STANDALONE_DATA_DIR=${RUNNER_TEMP}/reflink-home/data" >>"${GITHUB_ENV}"
    - name: Start standalone AKernel
      run: |
        IMAGE="akernel-ci/all-in-one:${GITHUB_SHA}" \
          AKERNEL_NAT_BACKEND=iptables \
          AKERNEL_CONTROL_BIND=127.0.0.1 \
          AKERNEL_DATA_BIND=127.0.0.1 \
          ./deploy/standalone/start.sh
    - name: Verify PID 1 detects its container
      run: |
        docker exec akernel-node bash -euo pipefail -c '
          tr "\0" "\n" < /proc/1/environ | grep -x "container=oci"
          test "$(cat /run/systemd/container)" = oci
          systemd-detect-virt --container
        '
    - name: Run SDK end-to-end examples
      run: |
        token="$(cat ${AKERNEL_STANDALONE_DATA_DIR}/token)"
        echo "::add-mask::${token}"
        export AKERNEL_TOKEN="${token}"
        source "${AKERNEL_STANDALONE_DATA_DIR}/sdk.env"
        export PYTHONPATH="${GITHUB_WORKSPACE}/akernel/sdk/python"

        examples=(
          basic_usage.py
          command_stdin.py
          custom_image.py
          dockerfile_launch.py
          named_sandbox.py
          network_policy.py
          port_forwarding.py
          pty.py
          reverse_tunnel.py
          storage_sandbox.py
        )
        for example in "${examples[@]}"; do
          echo "=== Running ${example} ==="
          example_timeout=120
          if [[ "${example}" == "dockerfile_launch.py" ]]; then
            # This example creates fresh sandboxes across nine sections.
            example_timeout=600
          fi
          timeout --kill-after=30s "${example_timeout}s" \
            python -u "sdk/python/examples/${example}"
        done
    - name: Run runsc SDK integration and standalone E2E
      run: |
        token="$(cat ${AKERNEL_STANDALONE_DATA_DIR}/token)"
        echo "::add-mask::${token}"
        export AKERNEL_TOKEN="${token}"
        source "${AKERNEL_STANDALONE_DATA_DIR}/sdk.env"
        export AKERNEL_RUN_INTEGRATION=1
        export PYTHONPATH="${GITHUB_WORKSPACE}/akernel/sdk/python"

        AKERNEL_TEST_RUNTIME=runsc timeout 900s python -m unittest discover \
          -s sdk/python/tests/integration \
          -t sdk/python \
          -v
        AKERNEL_TEST_RUNTIME=runsc timeout 900s python -m unittest discover \
          -s sdk/python/tests/e2e/standalone \
          -t sdk/python \
          -v
    - name: Show standalone diagnostics
      if: failure()
      run: |
        docker ps -a
        for container in akernel-node; do
          if docker container inspect "${container}" >/dev/null 2>&1; then
            echo "=== ${container}: docker logs ==="
            docker logs --tail 500 "${container}" 2>&1 || true
          fi
        done
        if docker container inspect akernel-node >/dev/null 2>&1; then
          echo "=== akernel-node: service journal ==="
          docker exec akernel-node journalctl --no-pager -n 500 \
            -u sandboxd.service -u adx.service || true
          docker exec akernel-node bash -c '
            shopt -s nullglob
            for logfile in \
              /home/akernel/logs/sandboxd/sandboxd*.log \
              /home/akernel/adx/logs/*.log \
              /home/akernel/adx/run/logs/*.log \
              /home/akernel/adx/run/*/logs/*.log \
              /home/akernel/sandboxd/image_manager/daemons/*/daemon.log; do
              echo "=== ${logfile} ==="
              tail -n 2000 "${logfile}"
            done
          ' || true
        fi
    - name: Stop standalone AKernel
      if: always()
      run: |
        if [[ -x ./deploy/standalone/stop.sh ]]; then
          ./deploy/standalone/stop.sh
        else
          docker rm -f akernel-node >/dev/null 2>&1 || true
        fi
    - name: Stop candidate artifact server
      if: always()
      run: if [[ -f "${RUNNER_TEMP}/candidate-http.pid" ]]; then kill "$(cat "${RUNNER_TEMP}/candidate-http.pid")" || true; fi
    - name: Release standalone XFS storage
      if: always()
      run: if mountpoint -q "${RUNNER_TEMP}/reflink-home"; then sudo umount "${RUNNER_TEMP}/reflink-home"; fi
    defaults:
      run:
        working-directory: akernel
    env:
      AKERNEL_CHUNK_DB_SIZE: 2GiB
      AKERNEL_ENABLE_KATA: 'false'
      AKERNEL_ENABLE_FIRECRACKER: 'false'
      AKERNEL_ENABLE_RUNC: 'false'
